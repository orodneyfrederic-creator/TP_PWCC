<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Page de connexion</title>
    <script src="https://kit.fontawesome.com/066b8a6038.js" crossorigin="anonymous"></script>
</head>
<body>
    
    <div class="login-box">
        <img src="icon-icons.svg" alt="film-logo">
        <center><h2>Se connectez à Films</h2></center>
        <button><img src="google.png"class="google-logo"> Se connecter avec Google</button>
        <hr>
        <center><span class="Or">Ou</span></center>
        <form>
            <center><input type="text" placeholder="Adresse e-mail ou nom d'utilisateur"></center>
             <center><input type="password" placeholder="Mot de passe"></center>
            <button class="next-button">
                <span class="next-button">Suivant</span>
            </button>
        </form>
        <button class="forgot-passwd">Mot de passe oublié ?</button><br>
        <p class="Signup">Vous n'avez pas de compte ?<a href="" target="_blank">Inscrivez-vous</a></p>
    </div>
    </div>
</body>
</html>
