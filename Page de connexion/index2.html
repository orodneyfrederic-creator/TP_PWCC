<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style2.css">
    <title>Page d'inscription</title>
    <script src="https://kit.fontawesome.com/066b8a6038.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="login-box">
        <img src="icon-icons.svg" alt="film-logo">
        <center><h2>S'inscrire à Films</h2></center>
        <form>
            <center><input type="text" placeholder="Nom"></center>
             <center><input type="text" placeholder="Prénom"></center>
              <center><input type="date" placeholder="Date de naissance"></center>
             <center><input type="text" placeholder="Adresse e-mail ou nom d'utilisateur"></center>
             <center><input type="password" placeholder="Mot de passe"></center>
              <center><input type="password" placeholder="Confirmer le mot de passe"></center>
            <button class="next-button">
                <span class="next-button">Suivant</span>
            </button>
        </form>
    </div>
</body>
</html>
